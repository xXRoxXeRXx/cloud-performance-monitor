# Cloud Performance Monitor - Simplified Alert Rules
# 6 essential alerts for non-enterprise monitoring
#
# Alerts:
# 1. ServiceDown - Monitor agent offline
# 2. CloudServiceUnavailable - Cloud service returning 5xx errors
# 3. SlowUploadSpeed - Upload speed below threshold
# 4. HighErrorRate - Test error rate too high
# 5. CircuitBreakerOpen - Circuit breaker triggered
# 6. PrometheusStorageNearFull - Storage running low

groups:
  - name: cloud_performance_alerts
    rules:
      # Monitor Agent offline - most critical
      - alert: ServiceDown
        expr: up{job="monitor-agent"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Monitor Agent ist offline"
          description: "Der Cloud Performance Monitor ist seit mehr als 2 Minuten nicht erreichbar."

      # Cloud service returning server errors (503/502/500/504)
      - alert: CloudServiceUnavailable
        expr: increase(cloud_test_errors_total{error_type=~"http_5...*"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} nicht erreichbar"
          description: "{{ $labels.service }} ({{ $labels.exported_instance }}) antwortet mit Server-Fehlern ({{ $labels.error_type }})."

      # Slow upload speed - performance issue
      - alert: SlowUploadSpeed
        expr: cloud_test_speed_mbytes_per_sec{type="upload"} < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Langsame Upload-Geschwindigkeit bei {{ $labels.service }}"
          description: "Upload-Speed {{ printf \"%.2f\" $value }} MB/s ist unter 1 MB/s Schwellwert bei {{ $labels.exported_instance }}."

      # High error rate - reliability issue
      - alert: HighErrorRate
        expr: |
          (
            sum by (service, exported_instance) (increase(cloud_test_errors_total[30m])) 
            / 
            (sum by (service, exported_instance) (increase(cloud_test_success[30m])) + sum by (service, exported_instance) (increase(cloud_test_errors_total[30m])))
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hohe Fehlerrate bei {{ $labels.service }}"
          description: "Fehlerrate bei {{ $labels.service }} ({{ $labels.exported_instance }}) ist über 20%."

      # Circuit breaker triggered - immediate action needed
      - alert: CircuitBreakerOpen
        expr: nextcloud_circuit_breaker_state > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit Breaker offen für {{ $labels.service }}"
          description: "Circuit Breaker wurde für {{ $labels.service }} ({{ $labels.instance }}) ausgelöst. Service wird temporär nicht getestet."

      # Prometheus storage running low
      - alert: PrometheusStorageNearFull
        expr: (prometheus_tsdb_storage_blocks_bytes / (100 * 1024 * 1024 * 1024)) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus Speicher fast voll"
          description: "Prometheus Speicher ist über 80% belegt. Alte Daten bereinigen oder Retention anpassen."
