groups:
  - name: performance_averages
    interval: 300s  # Calculate every 5 minutes
    rules:
      # Daily Upload Speed Averages (24 hours)
      - record: cloud_daily_average_upload_speed_mbytes_per_sec
        expr: |
          avg_over_time(
            cloud_test_speed_mbytes_per_sec{type="upload"}[24h]
          )
        labels:
          period: "24h"

      # Daily Download Speed Averages (24 hours)  
      - record: cloud_daily_average_download_speed_mbytes_per_sec
        expr: |
          avg_over_time(
            cloud_test_speed_mbytes_per_sec{type="download"}[24h]
          )
        labels:
          period: "24h"

      # Monthly Upload Speed Averages (30 days)
      - record: cloud_monthly_average_upload_speed_mbytes_per_sec
        expr: |
          avg_over_time(
            cloud_test_speed_mbytes_per_sec{type="upload"}[30d]
          )
        labels:
          period: "30d"

      # Monthly Download Speed Averages (30 days)
      - record: cloud_monthly_average_download_speed_mbytes_per_sec
        expr: |
          avg_over_time(
            cloud_test_speed_mbytes_per_sec{type="download"}[30d]
          )
        labels:
          period: "30d"

      # Daily Success Rates
      - record: cloud_daily_success_rate_percent
        expr: |
          (
            sum_over_time(cloud_test_success{error_code="none"}[24h]) /
            count_over_time(cloud_test_success[24h])
          ) * 100
        labels:
          period: "24h"

      # Monthly Success Rates  
      - record: cloud_monthly_success_rate_percent
        expr: |
          (
            sum_over_time(cloud_test_success{error_code="none"}[30d]) /
            count_over_time(cloud_test_success[30d])
          ) * 100
        labels:
          period: "30d"

      # Daily Test Counts
      - record: cloud_daily_test_count
        expr: |
          count_over_time(cloud_test_duration_seconds[24h])
        labels:
          period: "24h"

      # Monthly Test Counts
      - record: cloud_monthly_test_count
        expr: |
          count_over_time(cloud_test_duration_seconds[30d])
        labels:
          period: "30d"

  - name: performance_trends
    interval: 1800s  # Calculate every 30 minutes
    rules:
      # Upload Speed Trend (comparing current vs daily average)
      - record: cloud_upload_speed_trend_ratio
        expr: |
          (
            rate(cloud_test_speed_mbytes_per_sec{type="upload"}[1h]) /
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="upload"}[24h])
          )
        labels:
          trend_type: "upload_speed"

      # Download Speed Trend (comparing current vs daily average)
      - record: cloud_download_speed_trend_ratio
        expr: |
          (
            rate(cloud_test_speed_mbytes_per_sec{type="download"}[1h]) /
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="download"}[24h])
          )
        labels:
          trend_type: "download_speed"

      # Performance Degradation Detection (when current < 80% of daily average)
      - record: cloud_performance_degradation
        expr: |
          (
            avg_over_time(cloud_test_speed_mbytes_per_sec[1h]) /
            avg_over_time(cloud_test_speed_mbytes_per_sec[24h])
          ) < 0.8
        labels:
          alert_type: "performance_degradation"

  - name: service_comparisons
    interval: 600s  # Calculate every 10 minutes
    rules:
      # Upload Speed Comparison between services
      - record: cloud_service_upload_speed_ranking
        expr: |
          sort_desc(
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="upload"}[1h])
          )

      # Download Speed Comparison between services  
      - record: cloud_service_download_speed_ranking
        expr: |
          sort_desc(
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="download"}[1h])
          )

      # Best performing service (combined upload + download)
      - record: cloud_best_performing_service
        expr: |
          sort_desc(
            (
              avg_over_time(cloud_test_speed_mbytes_per_sec{type="upload"}[1h]) +
              avg_over_time(cloud_test_speed_mbytes_per_sec{type="download"}[1h])
            ) / 2
          )

  - name: monthly_historical_metrics
    interval: 3600s  # Calculate every hour (sufficient for monthly aggregates)
    rules:
      # ========================================
      # MONTHLY UPLOAD METRICS
      # ========================================
      
      # Monthly Average Upload Speed (MB/s)
      - record: cloud_monthly_upload_speed_avg
        expr: |
          avg by (service, instance) (
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="upload"}[30d])
          )
        labels:
          type: "upload"
          aggregation: "monthly_avg"

      # Monthly Maximum Upload Speed (MB/s)
      - record: cloud_monthly_upload_speed_max
        expr: |
          max by (service, instance) (
            max_over_time(cloud_test_speed_mbytes_per_sec{type="upload"}[30d])
          )
        labels:
          type: "upload"
          aggregation: "monthly_max"

      # Monthly Minimum Upload Speed (MB/s)
      - record: cloud_monthly_upload_speed_min
        expr: |
          min by (service, instance) (
            min_over_time(cloud_test_speed_mbytes_per_sec{type="upload"}[30d])
          )
        labels:
          type: "upload"
          aggregation: "monthly_min"

      # Monthly P95 Upload Duration (seconds)
      - record: cloud_monthly_upload_duration_p95
        expr: |
          quantile by (service, instance) (0.95,
            cloud_test_duration_seconds{type="upload"}
          )
        labels:
          type: "upload"
          aggregation: "monthly_p95"

      # ========================================
      # MONTHLY DOWNLOAD METRICS
      # ========================================
      
      # Monthly Average Download Speed (MB/s)
      - record: cloud_monthly_download_speed_avg
        expr: |
          avg by (service, instance) (
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="download"}[30d])
          )
        labels:
          type: "download"
          aggregation: "monthly_avg"

      # Monthly Maximum Download Speed (MB/s)
      - record: cloud_monthly_download_speed_max
        expr: |
          max by (service, instance) (
            max_over_time(cloud_test_speed_mbytes_per_sec{type="download"}[30d])
          )
        labels:
          type: "download"
          aggregation: "monthly_max"

      # Monthly Minimum Download Speed (MB/s)
      - record: cloud_monthly_download_speed_min
        expr: |
          min by (service, instance) (
            min_over_time(cloud_test_speed_mbytes_per_sec{type="download"}[30d])
          )
        labels:
          type: "download"
          aggregation: "monthly_min"

      # Monthly P95 Download Duration (seconds)
      - record: cloud_monthly_download_duration_p95
        expr: |
          quantile by (service, instance) (0.95,
            cloud_test_duration_seconds{type="download"}
          )
        labels:
          type: "download"
          aggregation: "monthly_p95"

      # ========================================
      # WEEKLY METRICS (for trend comparison)
      # ========================================
      
      # Weekly Average Upload Speed
      - record: cloud_weekly_upload_speed_avg
        expr: |
          avg by (service, instance) (
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="upload"}[7d])
          )
        labels:
          type: "upload"
          aggregation: "weekly_avg"

      # Weekly Average Download Speed
      - record: cloud_weekly_download_speed_avg
        expr: |
          avg by (service, instance) (
            avg_over_time(cloud_test_speed_mbytes_per_sec{type="download"}[7d])
          )
        labels:
          type: "download"
          aggregation: "weekly_avg"

      # ========================================
      # MONTHLY RELIABILITY METRICS
      # ========================================
      
      # Monthly Uptime/Success Rate (percentage of successful tests)
      - record: cloud_monthly_uptime_percent
        expr: |
          (
            sum by (service, instance) (
              sum_over_time(cloud_test_success{error_code="none"}[30d])
            ) /
            sum by (service, instance) (
              count_over_time(cloud_test_success[30d])
            )
          ) * 100
        labels:
          aggregation: "monthly_uptime"

      # Monthly Error Count
      - record: cloud_monthly_error_count
        expr: |
          sum by (service, instance, error_type) (
            increase(cloud_test_errors_total[30d])
          )
        labels:
          aggregation: "monthly_errors"

      # Monthly Total Tests
      - record: cloud_monthly_total_tests
        expr: |
          sum by (service, instance) (
            count_over_time(cloud_test_duration_seconds[30d])
          )
        labels:
          aggregation: "monthly_test_count"
