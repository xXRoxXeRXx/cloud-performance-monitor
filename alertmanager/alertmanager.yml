# Alertmanager Configuration - Local Development (no email)
# Simplified for non-enterprise use

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@localhost'

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'default'
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
  
  - source_match:
      alertname: 'CircuitBreakerOpen'
    target_match_re:
      alertname: '(SlowUploadSpeed|HighErrorRate)'
    equal: ['service']

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://webhook-logger:8080/webhook'
        send_resolved: true
